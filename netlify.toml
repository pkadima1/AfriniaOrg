[build]
  # Next.js on Netlify (decision D1): Netlify's Next.js runtime serves .next.
  publish = ".next"
  command = "npm run build"

[build.environment]
  # Functions run on the same Node version as the build (Netlify default).
  # Keep >= 22: firebase-admin@14 declares engines.node >= 22. Note the AWS
  # Lambda nodejs22.x image runs a Node build < 22.12 without require(esm),
  # which is why package.json pins jwks-rsa to 3.x (jose v4, dual CJS/ESM) —
  # jwks-rsa@4 pulls the ESM-only jose v6 and crashes every function that
  # imports firebase-admin at load (ERR_REQUIRE_ESM → 502).
  NODE_VERSION = "22"

[functions]
  directory = "netlify/functions"
  node_bundler = "nft"

[dev]
  command = "npm run dev"
  targetPort = 8080
  port = 8888

# The dynamic sitemap is NOT routed here: netlify/functions/sitemap.js claims
# /sitemap.xml itself via `export const config = { path }` (see why there).

# Redirects live in next.config.ts. Security headers: the list is
# config/security-headers.json. next.config.ts applies it to pages Next.js
# renders; the [[headers]] block below MUST repeat the same values for static
# files and functions (Netlify applies neither mechanism to the other's
# responses — verified on draft deploys 2026-10-02). A unit test enforces it.
# Unknown URLs get a real 404 from app/not-found.tsx via src/routing/spaRoutes.ts.
# Note: [[context.production.redirects]] is silently ignored by Netlify —
# redirects and headers cannot be scoped to deploy contexts in netlify.toml.

# Baseline security headers for every response (pages, assets, functions).
# Deliberately NOT a Content-Security-Policy yet: a CSP must list every origin
# the app loads (GA, Firebase, Storage, fonts) and is tested as a unit in the
# Next.js hardening phase (CLAUDE.md §10, M6). These four have no such risk:
#   X-Content-Type-Options — browsers must trust the declared file type (blocks
#                            content-sniffing attacks on uploaded files).
#   X-Frame-Options        — other sites cannot embed Afrinia in a frame
#                            (clickjacking); same-origin framing still works.
#   Referrer-Policy        — other sites see only "afrinia.org", never the full
#                            URL a visitor came from.
#   Permissions-Policy     — the site never uses camera, microphone, location
#                            or payments, so no script (incl. third-party) can.
# Strict-Transport-Security is already sent by Netlify for the custom domain.
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "SAMEORIGIN"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=(), usb=()"
